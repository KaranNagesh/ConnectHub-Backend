server:
  port: ${ADMIN_SERVER_PORT:8089}

spring:
  config:
    import: optional:file:../.env
  application:
    name: admin-server
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin_password}
  boot:
    admin:
      ui:
        title: "ConnectHub Admin"

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ConnectHub Admin Server
    version: 1.0.0


